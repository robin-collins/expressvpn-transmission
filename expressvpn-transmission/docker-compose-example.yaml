services:
  transmission:
    image: speeddemonau/expressvpn-transmission:local
    pull_policy: never
    container_name: transmission
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/root/.config/transmission-daemon
      - /home/user/Torrents:/var/lib/transmission-daemon/downloads
    environment:
      SERVER: smart
      T_ALLOWED: "127.0.0.1,192.168.0.*"
      T_USERNAME: "username"
      T_PASSWORD: "password"
    secrets:
      - expressvpn_activation_code
    ports:
      - 9091:9091

# Put the activation code alone in this file (chmod 600) and keep it out of git.
# To rotate: edit the file, then `docker compose restart transmission`.
secrets:
  expressvpn_activation_code:
    file: ./expressvpn_activation_code
